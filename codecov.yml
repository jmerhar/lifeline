# Codecov configuration. Coverage is uploaded per suite, each under its own flag, so the web
# UI is browsable per suite.
coverage:
  status:
    project:
      default:
        # Informational only: the real gate runs in CI with its thresholds in coverage.toml.
        informational: true
    patch:
      default:
        informational: true

comment: false

flags:
  backend:
    paths:
      - backend/
    carryforward: true
  frontend:
    paths:
      - frontend/
    carryforward: true
