# Builds the image from this working copy instead of pulling the published one.
#
# Kept out of docker-compose.yml so that file stands alone: someone running lifeline needs
# nothing but the compose file itself, and `docker compose up` would try to build — and fail —
# if it named a build context they have not got.
services:
  lifeline:
    build:
      context: .
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-}
