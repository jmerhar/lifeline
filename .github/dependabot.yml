# Generated by devtools-check.py --fix from devtools.toml's [dependabot] table: edit that
# table rather than this file, which `devtools-check.py` compares with what it generates.
#
# Weekly updates: per ecosystem, one pull request of minor and patch releases and one
# of majors, which waits for a hand migration. A release is taken once it is three days
# old, so a hijacked version has usually been pulled before an update proposes it; the
# packages released from the same hands are taken at once.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
    groups:
      actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      actions-majors:
        patterns:
          - "*"
        update-types:
          - "major"

  # The interface.
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
      exclude:
        - "@jmerhar/*"
    groups:
      frontend:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      frontend-majors:
        patterns:
          - "*"
        update-types:
          - "major"

  # The backend's declared ranges and its exact jigkit pin.
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
      exclude:
        - "jigkit"
    groups:
      backend:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      backend-majors:
        patterns:
          - "*"
        update-types:
          - "major"
