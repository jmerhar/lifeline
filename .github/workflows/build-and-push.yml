name: Test and Publish

on:
  # push is limited to main because pull_request already covers branch work; triggering on
  # both would run the whole suite twice for every pull request.
  # A release tag (v1.2.3) publishes that version's image and its GitHub release.
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install
        run: pip install -e "backend[test]"

      - name: Install the browser and a display for it
        # The interactive-login tests need a real headful Chromium, which needs an X server.
        # They are the only thing that proves the login path works, so CI provides both.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb x11vnc
          python -m playwright install --with-deps chromium

      - name: Run tests
        env:
          # The runner's own Python, rather than the virtualenv a local run uses.
          PYTHON: python
          # Not :99, which is the application's own default. The suite builds the real service
          # graph at one point, and that reaps stray X servers on the configured display — on a
          # machine where CI's own display is the one it is configured to reclaim, the suite
          # kills the display the rest of it needs.
          LIFELINE_TEST_DISPLAY: ":77"
        # Through the same script as `make test-backend`, so CI and a local run cannot drift.
        run: |
          # Xvfb's output is left in the log on purpose. It opens with a screen of "Could not
          # resolve keysym XF86…" warnings, which are this xkeyboard-config not knowing some of
          # the keysyms in the keymap and are harmless — Xvfb says as much itself. Suppressing
          # them would also suppress whatever it has to say on the day the display genuinely
          # fails to start, and that failure otherwise surfaces only as a browser launch timing
          # out for no visible reason.
          Xvfb :77 -screen 0 1280x800x24 &
          trap 'kill %1' EXIT
          bin/test-backend.sh -v --junitxml=junit/backend.xml \
            --cov=lifeline --cov-report=term-missing \
            --cov-report=xml --cov-report=json --cov-report=html

      - name: Upload backend coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-backend
          path: |
            backend/coverage.xml
            backend/coverage.json
            backend/htmlcov
            backend/junit
          if-no-files-found: error

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Check types
        working-directory: frontend
        run: npx tsc -b --force

      - name: Lint
        working-directory: frontend
        run: npx eslint .

      - name: Run tests
        working-directory: frontend
        run: npx vitest run --coverage

      - name: Upload frontend coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-frontend
          path: frontend/coverage
          if-no-files-found: error

  contract:
    # The frontend's types are generated from the API's schema. Regenerating here and diffing
    # is what makes that a guarantee rather than a convention: a Pydantic model changed without
    # running `make openapi` fails the build instead of surfacing as an undefined field months
    # later.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: |
          pip install -e backend
          cd frontend && npm ci

      - name: Fetch the shared tooling
        run: bin/devtools-fetch.sh

      - name: Regenerate the schema and types
        env:
          PYTHON: python
        run: .devtools/bin/openapi.sh

      - name: Check the committed copies are current
        run: git diff --exit-code frontend/openapi.json frontend/src/types/api.d.ts

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The shared scripts from jmerhar/devtools, at the ref devtools.toml pins.
      - name: Fetch the shared tooling
        run: bin/devtools-fetch.sh

      - name: ShellCheck
        run: shellcheck bin/*.sh

      - name: Lockfile resolves only to the public registry
        run: .devtools/bin/check-lockfile.sh

      # Every manifest names one version; a release tag must name it, with its changelog notes.
      - name: Versions agree
        run: python3 .devtools/bin/version.py check ${{ github.ref_type == 'tag' && github.ref_name || '' }}

  coverage:
    # Joins both suites into one summary, gate, Codecov upload and publish. The suites run in
    # separate jobs, so this is where their reports are brought together.
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      # Restored to the paths coverage.toml declares.
      - uses: actions/download-artifact@v8
        with:
          name: coverage-backend
          path: backend
      - uses: actions/download-artifact@v8
        with:
          name: coverage-frontend
          path: frontend/coverage

      # The combined table on the run's summary page. The suites, their labels and their
      # gates are all declared in coverage.toml.
      - uses: jmerhar/coverage/.github/actions/summary@v1

      # Informational (see codecov.yml), and before the gate so the data lands even when the
      # gate fails. `!cancelled()` so a failed suite still reports its failures.
      - uses: jmerhar/coverage/.github/actions/codecov@v1
        if: ${{ !cancelled() }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          junit: backend/junit/*.xml

      # The gate: fails the build if either suite drops below its bound in coverage.toml.
      # publish needs this job, so a regression blocks the release.
      - uses: jmerhar/coverage/.github/actions/gate@v1

      # Publish both suites' HTML under one SHA. Only on green pushes to main; the action
      # skips when the token is absent, so this stays green if the secret is ever missing.
      - uses: jmerhar/coverage/.github/actions/publish@v1
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          token: ${{ secrets.COVERAGE_PAGES_TOKEN }}
          description: Backend + frontend HTML coverage report

  publish:
    # Only after everything is green: the image a deployment pulls is never built from code
    # whose tests did not pass.
    needs: [coverage, lint, contract]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          # edge for deployments that follow the branch, an immutable tag so a specific build can
          # always be pinned or rolled back to, and on a release tag its version, minor and major
          # line (the action makes no bare major tag for a 0.x release, which version.py's
          # compose pin allows for).
          tags: |
            type=edge
            type=sha,format=long
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    # The GitHub release for a version, once its image is published.
    needs: [publish]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Fetch the shared tooling
        run: bin/devtools-fetch.sh

      - name: Create the GitHub release from the changelog
        run: .devtools/bin/github-release.sh "${{ github.ref_name }}"
        env:
          GH_TOKEN: ${{ github.token }}
