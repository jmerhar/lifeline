[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lifeline"
version = "0.1.0"
description = "Keep logged-in website sessions alive with scheduled pings"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141,<0.142",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.27",
    "cryptography>=42.0",
    "argon2-cffi>=23.1",
    "apprise>=1.9",
    # The websocket client side of the noVNC bridge. uvicorn[standard] brings the
    # server half; this is what the bridge dials websockify with.
    "websockets>=13.0",
    # Imported lazily by services.browser.supervisor, so neither the tests nor a
    # cookie-import-only deployment need a browser binary on disk.
    "playwright>=1.49",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.8",
]

[project.urls]
Homepage = "https://github.com/jmerhar/lifeline"

[tool.hatch.build.targets.wheel]
packages = ["src/lifeline"]

[tool.ruff]
# Matches the width the code is already written to, and what the frontend's formatter uses.
line-length = 100
target-version = "py314"

[tool.ruff.lint]
# On top of the defaults (pyflakes and pycodestyle errors): unused arguments and imports,
# comprehension and builtin misuse, and the bug-prone patterns in flake8-bugbear — mutable
# default arguments and `except` clauses that swallow everything among them.
select = ["E", "F", "W", "I", "B", "C4", "UP", "ARG", "SIM"]

[tool.ruff.lint.per-file-ignores]
# A pytest fixture is very often requested for what it does rather than for its value — `admin`
# creates the administrator, `services` installs the stand-ins — and naming it in the signature is
# the only way to ask for it.
"tests/**" = ["ARG001", "ARG002"]
# Written by `alembic revision --autogenerate`; reflowing them by hand would be undone by the
# next generated migration.
"alembic/versions/*" = ["E501", "W291"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.coverage.run]
# Measure the package only; migrations and the CLI shim carry no testable logic and
# would dilute the number.
source = ["lifeline"]
# This package is async throughout. Coverage's sys.monitoring core (COVERAGE_CORE=sysmon,
# set in bin/test-backend.sh and CI) traces lines after `await`, which the legacy C core
# under-reports; on 3.14 sysmon is the default and supports branch coverage, so branches
# are safe to enable.
branch = true
omit = [
    "*/alembic/*",
    "*/tests/*",
    "*/__main__.py",
]

[tool.coverage.report]
show_missing = true
# `exclude_also` augments coverage's default pragma list rather than replacing it, so
# `# pragma: no cover` still works alongside these structural exclusions.
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
]
