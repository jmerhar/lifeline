[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lifeline"
version = "0.1.0"
description = "Keep logged-in website sessions alive with scheduled pings"
requires-python = ">=3.14"
dependencies = [
    # Settings, database, migrations, logging and the health probe shared with the other apps
    # built on it. Pinned exactly; Dependabot proposes each new release.
    "jigkit[auth,db,notify,web]==0.5.1",
    "fastapi>=0.162.0,<0.163",
    "uvicorn[standard]>=0.54.0",
    "sqlalchemy[asyncio]>=2.1.6",
    "aiosqlite>=0.22.1",
    "alembic>=1.20.1",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "httpx>=0.28.1",
    "cryptography>=50.0.2",
    "apprise>=2.1.0",
    # The websocket client side of the noVNC bridge. uvicorn[standard] brings the
    # server half; this is what the bridge dials websockify with.
    "websockets>=17.3",
    # Imported lazily by services.browser.supervisor, so neither the tests nor a
    # cookie-import-only deployment need a browser binary on disk.
    "playwright>=1.64.1",
]

[project.optional-dependencies]
test = [
    "jigkit[testing]==0.5.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.17.3",
]

[project.urls]
Homepage = "https://github.com/jmerhar/lifeline"

[tool.hatch.build.targets.wheel]
packages = ["src/lifeline"]

[tool.ruff]
# The rules are the shared ones from jmerhar/devtools, fetched into .devtools/ by `make`.
extend = "../.devtools/config/ruff.toml"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.coverage.run]
# Measure the package only; migrations and the CLI shim carry no testable logic and
# would dilute the number.
source = ["lifeline"]
# This package is async throughout. Coverage's sys.monitoring core (COVERAGE_CORE=sysmon,
# set in bin/test-backend.sh and CI) traces lines after `await`, which the legacy C core
# under-reports; on 3.14 sysmon is the default and supports branch coverage, so branches
# are safe to enable.
branch = true
omit = [
    "*/alembic/*",
    "*/tests/*",
    "*/__main__.py",
]

[tool.coverage.report]
show_missing = true
# `exclude_also` augments coverage's default pragma list rather than replacing it, so
# `# pragma: no cover` still works alongside these structural exclusions.
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
]
