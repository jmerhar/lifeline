# The stack, as one service.
#
# Self-contained on purpose: this file is all anyone needs to run lifeline, so it pulls the
# published image rather than naming a build context. Building from source is
# docker-compose.build.yml, which `make up` adds.
#
# Everything mutable lives in ./data: the SQLite database, the encryption key generated on
# first boot, and one browser profile per site. Back that directory up and there is nothing
# else to keep.
services:
  lifeline:
    # The release line: every release that keeps these settings and the stored data working.
    image: ghcr.io/jmerhar/lifeline:0.1
    container_name: lifeline
    restart: unless-stopped
    # A browser is a tree of processes, and PID 1 has to reap the ones it orphans.
    init: true
    # Runs as an ordinary user so the files under ./data belong to a real account on the
    # host. Change it to match the owner of that directory.
    user: "${LIFELINE_UID:-1000}:${LIFELINE_GID:-1000}"
    # Chromium needs more shared memory than Docker's 64 MB default; without this it
    # crashes on pages of any size.
    shm_size: 512m
    mem_limit: 2g
    environment:
      TZ: ${TZ:-UTC}
      # Unset, an encryption key is generated into ./data on first boot. Supply one to keep
      # it outside the data directory; losing it means logging into every site again.
      SECRET_KEY: ${SECRET_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # The address people open the interface at behind your reverse proxy, such as
      # https://lifeline.example.com. Writes from any other origin are refused.
      PUBLIC_URL: ${PUBLIC_URL:-}
      # The proxies whose X-Forwarded-For and X-Forwarded-Proto are believed: loopback, and
      # Docker's bridge networks, which a proxy on this host reaches a published port through.
      # The client address the login throttle counts is the last one an untrusted hop added, so
      # "*" would let a client choose its own.
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1,172.16.0.0/12}
    ports:
      # Published on the loopback interface: put a reverse proxy in front of this rather than
      # exposing it directly. Change to "8000:8000" to reach it from your network.
      - "${LIFELINE_BIND:-127.0.0.1}:${LIFELINE_PORT:-8000}:8000"
    volumes:
      - ./data:/data
